<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GAME TITLE</title>
<style>
html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;font-family:system-ui,sans-serif}
#wrap{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
canvas{width:1280px;height:720px;display:block}
</style></head><body><div id="wrap"><canvas id="gl" width="1280" height="720"></canvas></div>
<script>
// fixed 1280x720 stage, scaled to fit
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720),w=document.getElementById('wrap');
w.style.transform=`translate(${(innerWidth-1280*s)/2}px,${(innerHeight-720*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
</script>
