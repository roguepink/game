function trackFrame(s, out) {

function chunkedInstances(geo, mat, list, chunk, cast, maxDist) {
  const cells = new Map();
  for (const it of list) { const k = Math.floor(it.x / chunk) + ',' + Math.floor(it.z / chunk); let a = cells.get(k); if (!a) cells.set(k, (a = [])); a.push(it); }

    let cx = 0, cz = 0; arr.forEach((it) => { cx += it.x; cz += it.z; }); cx /= arr.length; cz /= arr.length;
    const g2 = geo.clone();

    arr.forEach((it, i) => {

const hsl = (h, s, l) => new THREE.Color().setHSL(h, s, l);

function buildScenery() {
  const R = mulberry32(31415);
  const q = {};
  const pines = [], rounds = [], bushes = [], rocks = [], flowers = [], posts = [], boardsL = [], boardsR = [], poles = [];
  const cell = HF.cell, nx = HF.nx, nz = HF.nz;
  const bx0 = HF.x0 + 30, bx1 = HF.x0 + (nx - 1) * cell - 30, bz0 = HF.z0 + 30, bz1 = HF.z0 + (nz - 1) * cell - 30;
  const br = FEAT.bridge, tn = FEAT.tunnel;
  const roundCol = () => {
    const r = R();
    if (r < 0.34) return hsl(0.27 + R() * 0.04, 0.62, 0.5);          // fresh green
    if (r < 0.56) return hsl(0.19 + R() * 0.03, 0.7, 0.52);          // yellow-green
    if (r < 0.74) return hsl(0.07 + R() * 0.03, 0.85, 0.55);         // autumn orange
    if (r < 0.88) return hsl(0.96 + R() * 0.02, 0.7, 0.68);          // sakura pink

  };

  const caps = { pine: 2400, round: 1200, bush: 800 };
  // 1) forest / meadow scatter
  for (let n = 0; n < 60000 && (pines.length < caps.pine || rounds.length < caps.round); n++) {
    const x = lerp(bx0, bx1, R()), z = lerp(bz0, bz1, R());
    const i = Math.round((x - HF.x0) / cell), j = Math.round((z - HF.z0) / cell), id = j * nx + i;
    const dr = HF.dr[id]; const w = dr < 75 ? wAt(HF.sv[id] / TR.ds) : 8;
    const edge = dr - w;
    if (edge < WALL_EXTRA + 2.5) continue;
    const p = 0.9 * Math.exp(-(edge - 8) / 55) + 0.07;
    if (R() > p) continue;
    const ny = HF.nrm[id * 3 + 1]; if (ny < 0.8) continue;
    const hv = HF.hv[id], hp = HF.hp[id];

    if (hv > 112) continue;
    if (nearCreek(x, z, 3)) continue;
    const sc = (0.85 + R() * 0.8) * (1 + Math.min(edge, 300) / 260);
    const kind = R();
    if (kind < 0.62 && pines.length < caps.pine) pines.push({ x, y: hv - 0.25, z, sx: sc, sy: sc * (0.9 + R() * 0.5), ry: R() * TAU, c: pineCol() });
    else if (rounds.length < caps.round) rounds.push({ x, y: hv - 0.25, z, sx: sc * 0.95, sy: sc * (0.85 + R() * 0.4), ry: R() * TAU, c: roundCol() });
  }

  for (let n = 0; n < 40000 && bushes.length < caps.bush; n++) {
    const x = lerp(bx0, bx1, R()), z = lerp(bz0, bz1, R());
    const id = Math.round((z - HF.z0) / cell) * nx + Math.round((x - HF.x0) / cell);
    const dr = HF.dr[id]; if (dr > 70) continue;
    const edge = dr - (wAt(HF.sv[id] / TR.ds));
    if (edge < WALL_EXTRA + 1.5 || R() > 0.55 * Math.exp(-(edge - 6) / 30)) continue;
    if (HF.nrm[id * 3 + 1] < 0.78 || HF.hp[id] - HF.hv[id] > 1) continue;
    if (inTunnelFootprint(HF.sv[id], HF.lv[id], 3)) continue;

    bushes.push({ x, y: HF.hv[id] - 0.1, z, sx: sc, sy: sc * (0.8 + R() * 0.4), ry: R() * TAU, c: R() < 0.3 ? roundCol() : pineCol() });

    const id = Math.round((z - HF.z0) / cell) * nx + Math.round((x - HF.x0) / cell);

      const ss = tn2.s0 - 1.5 + R() * len2, x = (R() * 2 - 1) * TUN.Wm * 0.85;

      const wx = fr2.x + fr2.rx * x, wz = fr2.z + fr2.rz * x, y = yAt(fr2.fi) - TUN.off + tunProf(x, ss) - 0.25, sc = 0.9 + R() * 0.9;
      if (R() < 0.55) pines.push({ x: wx, y, z: wz, sx: sc, sy: sc * (0.9 + R() * 0.5), ry: R() * TAU, c: pineCol() });
      else if (R() < 0.6) rounds.push({ x: wx, y, z: wz, sx: sc * 0.9, sy: sc, ry: R() * TAU, c: roundCol() });
      else { const g = 0.55 + R() * 0.3; rocks.push({ x: wx, y: y + 0.3, z: wz, sx: 1.2 + R() * 1.6, sy: 1 + R() * 1.2, sz: 1.2 + R() * 1.6, ry: R() * TAU, c: new THREE.Color(g, g * 0.97, g * 0.92) }); }

        else if (kind < 0.8) { const g = 0.55 + R() * 0.3; rocks.push({ x, y: y + 0.5, z, sx: 1.4 + R() * 1.5, sy: 1.1 + R() * 1.3, sz: 1.4 + R() * 1.5, ry: R() * TAU, c: new THREE.Color(g, g * 0.97, g * 0.92) }); }

      }

function updateScenery(dt, t, camPos) {
  for (const c of SCN.clouds) { c.position.x += dt * 4; if (c.position.x > camPos.x + 1800) c.position.x -= 3600; }
  for (const b of SCN.balloons) {

    const cx = (HF.x0 + (HF.nx - 1) * HF.cell / 2), cz = (HF.z0 + (HF.nz - 1) * HF.cell / 2);
    b.position.x = cx + Math.cos(u.a) * u.d; b.position.z = cz + Math.sin(u.a) * u.d; b.position.y = u.y0 + Math.sin(t * 0.3 + u.ph) * 6; b.rotation.y = t * 0.1;
  }
  if (SCN.waterTex) SCN.waterTex.offset.y = -t * 0.04;
  if (SCN.creekTex) SCN.creekTex.offset.y = -t * 0.35;
  if (SCN.foam) for (const f of SCN.foam) f.material.opacity = 0.4 + Math.sin(t * 5) * 0.15;
  animateAnimals(t);
  if (ANIM.boostTex) ANIM.boostTex.offset.y = -((t * 1.6) % 1);
}

}

// ---------- the vehicle model ----------
function stepRacer(r, dt) {

  if (r.padCD > 0) r.padCD -= dt;

    startRace, enterTitle, startDemoScene, trackFrame, groundY, sNear, aiControl, placeRacer, rankRacers, useItem, hitRacer, say, worldAt, fordAt, OBS: FEAT.obst, effectsForRacer, updateRace,
  };
}
boot();

}
</script>
<script>
(function () {
  // three.js r128 is loaded by the <script> tag above (cdnjs); these mirrors are tried only if that failed
  var urls = [
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js',
    'vendor/three.min.js'
  ];
  var i = 0;
  function msg(t) { var el = document.getElementById('loadmsg'); if (el) el.textContent = t; }
  function fit() {
    var st = document.getElementById('stage'), wr = document.getElementById('wrap');
    var vw = wr.clientWidth || window.innerWidth, vh = wr.clientHeight || window.innerHeight;
    var k = Math.min(vw / 1280, vh / 720);
    st.style.transform = 'scale(' + k + ')';
    st.style.left = Math.round((vw - 1280 * k) / 2) + 'px';
    st.style.top = Math.round((vh - 720 * k) / 2) + 'px';
  }
  fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('wrap'));
  function boot() {
    try { startGame(); }
    catch (e) { console.error(e); msg('エラーが発生しました: ' + (e && e.message ? e.message : e)); }
  }
  function next() {
    if (i >= urls.length) { msg('three.js を読み込めませんでした。ネットワーク接続を確認して、ページを再読み込みしてください。'); return; }
    var s = document.createElement('script');
    s.src = urls[i++];
    s.onload = function () { if (window.THREE) boot(); else next(); };
    s.onerror = next;
    document.head.appendChild(s);
  }
  if (window.THREE) boot(); else next();
})();
</script>

}
</script>
